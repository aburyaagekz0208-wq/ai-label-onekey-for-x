 text-anchor="middle">F5</text><text x="790" y="374" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#1f1440" font-weight="400" text-anchor="start">キーを押す</text><rect x="50" y="500" width="1100" height="80" rx="14" fill="#fff8e1" stroke="#f2c94c" stroke-width="2" /><text x="68" y="539" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="400" text-anchor="start">拡張を入れる前から開いていた X のタブは、再読み込みするまで動きません。</text><text x="68" y="568" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="400" text-anchor="start">複数の Chrome プロフィールで X を使う人は、プロフィールごとに手順 2〜3 をやってください</text>
