<text x="60" y="80" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="34" fill="#1f1440" font-weight="700" text-anchor="start">うまく動かないときは</text>
<rect x="420" y="140" width="360" height="64" rx="14" fill="#efe9ff" stroke="#7c4dff" stroke-width="2" /><text x="600.0" y="175.5" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="700" text-anchor="middle">キーを押すと、画面の下に何か出る？</text><path d="M520,206 Q395.0,230.0 270,254" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M680,206 Q790.0,230.0 900,254" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><text x="150" y="238" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#ff4f7b" font-weight="700" text-anchor="start">赤い字が出る</text><text x="920" y="238" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="20" fill="#5d5480" font-weight="700" text-anchor="start">何も出ない</text><rect x="50" y="262" width="460" height="210" rx="14" fill="#fff" stroke="#e3dcf5" stroke-width="2" /><text x="280.0" y="318.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#1f1440" font-weight="400" text-anchor="middle">X の画面の作りが変わった可能性</text><text x="280.0" y="344.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#1f1440" font-weight="400" text-anchor="middle"></text><text x="280.0" y="370.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#1f1440" font-weight="400" text-anchor="middle">・投稿欄が開いているか確かめる</text><text x="280.0" y="396.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#1f1440" font-weight="400" text-anchor="middle">・GitHub の Issues で知らせてください</text><text x="280.0" y="422.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="18" fill="#1f1440" font-weight="400" text-anchor="middle">・新しい版が出たら入れ直す</text><rect x="620" y="262" width="530" height="64" rx="14" fill="#fff" stroke="#e3dcf5" stroke-width="2" /><text x="885.0" y="297.5" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="400" text-anchor="middle">① X のタブを再読み込みした？</text><rect x="620" y="342" width="530" height="64" rx="14" fill="#fff" stroke="#e3dcf5" stroke-width="2" /><text x="885.0" y="377.5" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="400" text-anchor="middle">② いま使っている Chrome プロフィールに入れた？</text><rect x="620" y="422" width="530" height="64" rx="14" fill="#fff" stroke="#e3dcf5" stroke-width="2" /><text x="885.0" y="457.5" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="19" fill="#1f1440" font-weight="400" text-anchor="middle">③ ツールバーの拡張アイコンを押すと動く？</text><path d="M760,490 Q730.0,511.0 700,532" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><path d="M1010,490 Q1040.0,511.0 1070,532" fill="none" stroke="#7c4dff" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)"/><rect x="560" y="540" width="280" height="76" rx="14" fill="#fff8e1" stroke="#f2c94c" stroke-width="2" /><text x="700.0" y="568.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="16" fill="#1f1440" font-weight="400" text-anchor="middle">動く → キーが届いていない</text><text x="700.0" y="592.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="16" fill="#1f1440" font-weight="400" text-anchor="middle">（マウス設定・他のソフト）</text><rect x="870" y="540" width="280" height="76" rx="14" fill="#fff8e1" stroke="#f2c94c" stroke-width="2" /><text x="1010.0" y="568.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="16" fill="#1f1440" font-weight="400" text-anchor="middle">動かない → 拡張を更新して</text><text x="1010.0" y="592.0" font-family="'BIZ UDPGothic','Yu Gothic UI','Meiryo',sans-serif" font-size="16" fill="#1f1440" font-weight="400" text-anchor="middle">X を再読み込み</text>
